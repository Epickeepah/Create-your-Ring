      <script>
        const ringContainer = document.getElementById("ring-options");

        const ringOptions = document.querySelectorAll(
          "#ring-options .button-frame",
        );

        const previousButton = document.getElementById("previous-ring");
        const nextButton = document.getElementById("next-ring");
        const ringCounter = document.getElementById("ring-counter");

        let currentRing = 0;

        function showRing(index) {
          ringOptions.forEach((ring, i) => {
            ring.classList.toggle("active", i === index);
          });

          ringCounter.textContent = `${currentRing + 1} / ${ringOptions.length}`;
        }

        // Previous button
        previousButton.addEventListener("click", () => {
          currentRing =
            (currentRing - 1 + ringOptions.length) % ringOptions.length;

          showRing(currentRing);
        });

        // Next button
        nextButton.addEventListener("click", () => {
          currentRing = (currentRing + 1) % ringOptions.length;

          showRing(currentRing);
        });

        // Swipe functionality
        let touchStartX = 0;
        let touchStartY = 0;

        ringContainer.addEventListener(
          "touchstart",
          (event) => {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
          },
          { passive: true },
        );

        ringContainer.addEventListener(
          "touchend",
          (event) => {
            const touchEndX = event.changedTouches[0].screenX;
            const touchEndY = event.changedTouches[0].screenY;

            const swipeDistanceX = touchEndX - touchStartX;
            const swipeDistanceY = touchEndY - touchStartY;

            const minimumSwipe = 50;

            // Only register horizontal swipes
            if (
              Math.abs(swipeDistanceX) > minimumSwipe &&
              Math.abs(swipeDistanceX) > Math.abs(swipeDistanceY)
            ) {
              if (swipeDistanceX < 0) {
                nextButton.click();
              } else {
                previousButton.click();
              }
            }
          },
          { passive: true },
        );

        // Display first ring
        showRing(currentRing);
      </script>
