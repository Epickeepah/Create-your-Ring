<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metal Style</title>
    <link rel="stylesheet" href="../css/design.css" />
    <link rel="stylesheet" href="../css/design-buttons.css" />
  </head>

  <body>
    <main>
      <div class="main-frame">
        <button
          class="start-button"
          id="start-button"
          style="
            position: absolute;
            top: 5px;
            left: 5px;
            width: 200px;
            height: 60px;
            font-size: 30px;
            padding: 0;
            box-sizing: border-box;
            z-index: 100;
          "
          onclick="window.location.href = './main-gemstone.html'"
        >
          Back
        </button>

        <!-- Style buttons -->
        <div class="main-button-framing">
          <h1 class="ring-context">
            Stone Setting/Arrangement <span style="font-size: 40px">4/10</span>
          </h1>
          <div class="button-row">
            <div class="button-frame">
              <img
                src="../images/solitaire-ring.png"
                alt="Engagement ring"
                class="images"
              />

              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select<br />
                Solitaire Design
              </button>
            </div>

            <div class="button-frame">
              <img src="../images/halo-ring.png" alt="ring" class="images" />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Halo Design
              </button>
            </div>

            <div class="button-frame">
              <img
                src="../images/three-stone-ring.png"
                alt="ring"
                class="images"
              />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Three Stone Design
              </button>
            </div>

            <div class="button-frame">
              <img
                src="../images/pave-ring.png"
                alt="ring"
                class="images"
                style="transform: scale(2)"
              />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Peve Design
              </button>
            </div>

            <div class="button-frame">
              <img src="../images/bezel-ring.png" alt="ring" class="images" />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Bezel Design
              </button>
            </div>
          </div>
        </div>
        <div class="level-two-button-framing">
          <div class="button-row">
            <div class="button-frame">
              <img src="../images/cluster-ring.png" alt="ring" class="images" />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Cluster Design
              </button>
            </div>

            <div class="button-frame">
              <img src="../images/tension-ring.png" alt="ring" class="images" />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Tension Design
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
