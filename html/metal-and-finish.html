<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metal Style</title>
    <link rel="stylesheet" href="../css/design.css" />
    <link rel="stylesheet" href="../css/mobile-version.css" />
    <link rel="stylesheet" href="../css/design-buttons.css" />
  </head>

  <body>
    <main>
      <div class="main-frame">
        <div class="back-button-frame">
          <button
            class="start-button"
            id="start-button"
            style="
              position: absolute;
              top: 5px;
              left: 5px;
              width: 200px;
              height: 60px;
              font-size: 30px;
              padding: 0;
              box-sizing: border-box;
              z-index: 100;
            "
            onclick="window.location.href = './ring-style.html'"
          >
            Back
          </button>
        </div>

        <!-- Style buttons -->
        <div class="main-button-framing">
          <h1 class="ring-context">
            Metal Type <span style="font-size: 40px">2/10</span>
          </h1>
          <div class="desktop-rings">
            <div class="button-row">
              <div class="button-frame">
                <img
                  src="../images/yellow-gold-ring.png"
                  alt="Engagement ring"
                  class="images"
                />

                <button
                  class="buttons"
                  onclick="window.location.href = './main-gemstone.html'"
                >
                  Select<br />
                  Yellow Gold
                </button>
              </div>

              <div class="button-frame">
                <img
                  src="../images/white-gold-ring.png"
                  alt="ring"
                  class="images"
                  style="transform: scale(1.9)"
                />
                <button
                  class="buttons"
                  onclick="window.location.href = './main-gemstone.html'"
                >
                  Select <br />
                  White Gold
                </button>
              </div>

              <div class="button-frame">
                <img
                  src="../images/rose-gold-ring.png"
                  alt="ring"
                  class="images"
                />
                <button
                  class="buttons"
                  onclick="window.location.href = './main-gemstone.html'"
                >
                  Select <br />
                  Rose Gold
                </button>
              </div>

              <div class="button-frame">
                <img src="../images/plat-ring.png" alt="ring" class="images" />
                <button
                  class="buttons"
                  onclick="window.location.href = './main-gemstone.html'"
                >
                  Select <br />
                  Platinume
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mobile-rings">
        <div class="mobile-carousel">
          <!-- Previous arrow -->
          <button
            class="carousel-arrow"
            id="previous-ring"
            aria-label="Previous ring"
          >
            &#10094;
          </button>

          <!-- Ring options -->
          <div class="button-row" id="ring-options">
            <div class="button-frame">
              <img
                src="../images/yellow-gold-ring.png"
                alt="Engagement ring"
                class="images"
              />

              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select<br />
                Yellow Gold
              </button>
            </div>

            <div class="button-frame">
              <img
                src="../images/white-gold-ring.png"
                alt="ring"
                class="images"
                style="transform: scale(1.9)"
              />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                White Gold
              </button>
            </div>

            <div class="button-frame">
              <img
                src="../images/rose-gold-ring.png"
                alt="ring"
                class="images"
              />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Rose Gold
              </button>
            </div>

            <div class="button-frame">
              <img src="../images/plat-ring.png" alt="ring" class="images" />
              <button
                class="buttons"
                onclick="window.location.href = './main-gemstone.html'"
              >
                Select <br />
                Platinume
              </button>
            </div>
          </div>

          <!-- Next arrow -->
          <button class="carousel-arrow" id="next-ring" aria-label="Next ring">
            &#10095;
          </button>
        </div>
      </div>
      <script>
        const ringOptions = document.querySelectorAll(
          "#ring-options .button-frame",
        );

        const previousButton = document.getElementById("previous-ring");
        const nextButton = document.getElementById("next-ring");

        let currentRing = 0;

        function showRing(index) {
          ringOptions.forEach((ring, i) => {
            ring.classList.toggle("active", i === index);
          });
        }

        previousButton.addEventListener("click", () => {
          currentRing =
            (currentRing - 1 + ringOptions.length) % ringOptions.length;

          showRing(currentRing);
        });

        nextButton.addEventListener("click", () => {
          currentRing = (currentRing + 1) % ringOptions.length;

          showRing(currentRing);
        });

        showRing(currentRing);
      </script>
    </main>
  </body>
</html>
